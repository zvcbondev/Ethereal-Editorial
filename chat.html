<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat — Ethereal Editorial</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="app-top"></header>
<div class="app">
  <nav id="sidebar" aria-label="Dashboard"></nav>
  <main class="app-main" style="max-width:820px;padding-top:20px;padding-bottom:20px">
    <div class="card" style="overflow:hidden">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)">
        <img src="logo-mark.png" alt="" style="height:30px;width:auto">
        <div><strong style="color:var(--ink)">Ethereal Editorial</strong><div class="tiny muted">Your private chat. Payment details are only ever shared here.</div></div>
      </div>
      <div class="chat">
        <div class="chat-log" id="log"><p class="loading-line">Loading messages…</p></div>
        <form class="chat-form" id="send" novalidate>
          <label for="msg" class="sr-only">Message</label>
          <textarea class="input" id="msg" maxlength="5000" placeholder="Write a message…" required></textarea>
          <button class="btn btn-ink" id="send-btn">Send</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var me, seen = {}, log = document.getElementById("log");
  function bubble(m) {
    if (seen[m.id]) return;
    seen[m.id] = 1;
    var empty = EE.$(".empty-chat", log); if (empty) empty.remove();
    var d = document.createElement("div");
    d.className = "bubble " + (m.sender_id === me.id ? "me" : "them");
    d.innerHTML = EE.esc(m.body) + "<small>" + (m.sender_id === me.id ? "You" : "Ethereal Editorial") + " · " + EE.fmtDate(m.created_at, true) + "</small>";
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }
  function fetchAll() {
    return EE.q(EE.sb.from("messages").select("*").eq("thread_id", me.id).order("created_at").limit(500)).then(function (rows) {
      if (!Object.keys(seen).length) log.innerHTML = rows.length ? "" : '<p class="muted small center empty-chat" style="margin:auto">Ask us anything about your book, an edit or a payment. We usually reply within a day.</p>';
      rows.forEach(bubble);
    });
  }
  var form = document.getElementById("send"), input = document.getElementById("msg");
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit")); } });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim(); if (!text) return;
    var btn = document.getElementById("send-btn"); EE.busy(btn, true, "…");
    EE.q(EE.sb.from("messages").insert({ thread_id: me.id, body: text }).select("*").single())
      .then(function (m) { bubble(m); input.value = ""; EE.busy(btn, false); input.focus(); })
      .catch(function (err) { EE.busy(btn, false); EE.fail(err); });
  });

  EE.guard(["author", "reader"]).then(function (p) {
    me = p;
    if (me.role === "admin") return location.replace("admin.html#chat");
    EE.mountShell("chat", me);
    return fetchAll().then(function () {
      // Live updates; a slow poll covers projects where Realtime is switched off.
      EE.sb.channel("thread-" + me.id)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages", filter: "thread_id=eq." + me.id }, function (payload) { bubble(payload.new); })
        .subscribe();
      setInterval(fetchAll, 20000);
    });
  }).catch(EE.fail);
});
</script>
</body>
</html>
