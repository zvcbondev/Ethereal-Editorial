<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My manuscripts — Ethereal Editorial</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="app-top"></header>
<div class="app">
  <nav id="sidebar" aria-label="Dashboard"></nav>
  <main class="app-main">
    <div class="page-head">
      <h1>My manuscripts</h1>
      <a class="btn btn-rust" href="new-beta-read.html">+ Upload manuscript</a>
    </div>
    <div class="ms-list" id="list"><p class="loading-line">Loading your manuscripts…</p></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  EE.guard(["author"]).then(function (me) {
    EE.mountShell("manuscripts", me);
    if (EE.param("welcome")) EE.toast("Welcome, " + me.name.split(" ")[0] + "! Upload your first manuscript to start a beta read.", "ok");
    if (EE.param("created")) EE.toast("Your beta read is live.", "ok");

    return EE.q(EE.sb.from("manuscripts")
      .select("id, title, genre, word_count, listed, created_at, chapters(count), comments(count), access(status, unlocked, finished)")
      .eq("author_id", me.id)
      .order("created_at", { ascending: false }));
  }).then(function (rows) {
    var list = document.getElementById("list");
    if (!rows.length) {
      list.innerHTML = '<div class="card empty"><h3 style="margin-bottom:8px">No manuscripts yet</h3><p>Upload your book, choose your questions and invite readers. It takes about five minutes.</p><a class="btn btn-rust" style="margin-top:18px" href="new-beta-read.html">Start a beta read</a></div>';
      return;
    }
    list.innerHTML = rows.map(function (m) {
      var chapters = (m.chapters[0] || {}).count || 0;
      var accepted = m.access.filter(function (a) { return a.status === "accepted"; });
      var requests = m.access.filter(function (a) { return a.status === "requested"; }).length;
      var progress = accepted.length && chapters ? Math.round(accepted.reduce(function (s, a) {
        return s + (a.finished ? chapters : Math.min(a.unlocked - 1, chapters)) / chapters;
      }, 0) / accepted.length * 100) : 0;
      return '<article class="card ms">' +
        '<div class="cover"></div>' +
        '<div class="ms-info"><h3>' + EE.esc(m.title) + '</h3>' +
        '<div class="meta">' + EE.esc(m.genre || "—") + ' · ' + EE.num(m.word_count) + ' words · ' + chapters + ' chapters · ' + (m.listed ? "Listed in Discover" : "Private") + '</div>' +
        '<div class="progress"><i style="width:' + progress + '%"></i></div><small>Average reader progress: ' + progress + '%</small></div>' +
        '<div class="ms-stats"><div><strong>' + accepted.length + '</strong><span>Readers</span></div><div><strong>' + ((m.comments[0] || {}).count || 0) + '</strong><span>Comments</span></div><div><strong>' + requests + '</strong><span>Requests</span></div></div>' +
        '<a class="btn btn-outline btn-sm" href="manuscript.html?id=' + encodeURIComponent(m.id) + '">Open</a>' +
        '</article>';
    }).join("");
  }).catch(EE.fail);
});
</script>
</body>
</html>
